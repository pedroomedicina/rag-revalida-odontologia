[project]
name = "rag-revalida-odontologia"
version = "0.1.0"
description = "Grounded Spanish RAG pipeline for endodontics study material."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.9",
    "pikepdf>=9.11",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
# Retrieval, indexing, and answering. Heavy (torch); not needed for prep or unit tests.
rag = [
    "psycopg[binary]>=3.2",
    "sentence-transformers>=5.1",
    "torch>=2.8",
    "openai>=2.30",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "known_bug: documents a confirmed defect from docs/status_2026-11-19.md; expected to fail until fixed",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is owned by `ruff format`; remaining long lines are user-facing strings.
ignore = ["E501"]
